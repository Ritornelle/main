<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index (Rating)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .album-list {
            list-style: none;
            padding: 0;
            font-size: 12px;
        }
        .album-item {
            margin-bottom: 0;
        }
        .album-item span {
            font-weight: bold;
        }
        .album-list li:empty {
            margin-bottom: 1em;
        }

        /* Search bar styling */
        #searchContainer {
            margin-bottom: 20px;
        }
        #searchInput {
            width: 100%;
            max-width: 600px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #searchInput:focus {
            outline: none;
            border-color: #007bff;
        }
    </style>
</head>
<body>
    <h1>Index (Rating)</h1>
    
    <div id="searchContainer">
        <input type="text" id="searchInput" placeholder="Search by artist, album, or year...">
    </div>

    <ul id="albumList" class="album-list"></ul>

    <script>
        // Full list of pages
        const pages = [
            'albums-of-2026.html', 'albums-of-2025.html', 'albums-of-2024.html', 'albums-of-2023.html',
            'albums-of-2022.html', 'albums-of-2021.html', 'albums-of-2020.html', 'albums-of-2019.html',
            'albums-of-2018.html', 'albums-of-2017.html', 'albums-of-2016.html', 'albums-of-2015.html',
            'albums-of-2014.html', 'albums-of-2013.html', 'albums-of-2012.html', 'albums-of-2011.html',
            'albums-of-2010.html', 'albums-of-2009.html', 'albums-of-2008.html', 'albums-of-2007.html',
            'albums-of-2006.html', 'albums-of-2005.html', 'albums-of-2004.html', 'albums-of-2003.html',
            'albums-of-2002.html', 'albums-of-2001.html', 'albums-of-2000.html', 'albums-of-1999.html',
            'albums-of-1998.html', 'albums-of-1997.html', 'albums-of-1996.html', 'albums-of-1995.html',
            'albums-of-1994.html', 'albums-of-1993.html', 'albums-of-1992.html', 'albums-of-1991.html',
            'albums-of-1990.html', 'albums-of-1989.html', 'albums-of-1988.html', 'albums-of-1987.html',
            'albums-of-1986.html', 'albums-of-1985.html', 'albums-of-1984.html', 'albums-of-1983.html',
            'albums-of-1982.html', 'albums-of-1981.html', 'albums-of-1980.html', 'albums-of-1979.html',
            'albums-of-1978.html', 'albums-of-1977.html', 'albums-of-1976.html', 'albums-of-1975.html',
            'albums-of-1974.html', 'albums-of-1973.html', 'albums-of-1972.html', 'albums-of-1971.html',
            'albums-of-1970.html', 'albums-of-1969.html', 'albums-of-1968.html', 'albums-of-1967.html',
            'albums-of-1966.html', 'albums-of-1965.html', 'albums-of-1964.html', 'albums-of-1963.html',
            'albums-of-1962.html', 'albums-of-1961.html', 'albums-of-1960.html', 'albums-of-1959.html',
            'albums-of-1958.html', 'albums-of-1957.html', 'albums-of-1956.html', 'albums-of-1955.html',
            'albums-of-1954.html', 'albums-of-1953.html', 'albums-of-1952.html', 'albums-of-1951.html',
            'albums-of-1950.html', 'albums-of-1949.html', 'albums-of-1948.html', 'albums-of-1947.html',
            'albums-of-1946.html', 'albums-of-1945.html', 'albums-of-1944.html', 'albums-of-1943.html',
            'albums-of-1942.html', 'albums-of-1941.html', 'albums-of-1940.html'
        ];

        let allAlbums = [];

        function parseRating(ratingText) {
            const text = ratingText.trim();
            let normalized = text
                .replace(/¾/g, '.75')
                .replace(/½/g, '.5')
                .replace(/¼/g, '.25');
            const rating = parseFloat(normalized);
            return isNaN(rating) ? null : rating;
        }

        function extractYear(page) {
            const match = page.match(/albums-of-(\d{4})\.html/);
            return match ? match[1] : 'Unknown';
        }

        async function fetchAlbumData() {
            allAlbums = [];

            for (const page of pages) {
                try {
                    const response = await fetch(page);
                    if (!response.ok) throw new Error(`Failed to fetch ${page}`);
                    const text = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');

                    const albums = doc.querySelectorAll('.album');
                    const year = extractYear(page);

                    albums.forEach(album => {
                        const ratingText = album.querySelector('.album-rating').textContent.trim();
                        const artist = album.querySelector('.album-text h3:nth-child(1)').textContent.trim();
                        const albumName = album.querySelector('.album-text h3:nth-child(2)').textContent.trim();
                        const rating = parseRating(ratingText);

                        if (rating !== null) {
                            allAlbums.push({ artist, albumName, rating, ratingText, year });
                        }
                    });
                } catch (error) {
                    console.error(`Error processing ${page}:`, error);
                }
            }

            // Sort by rating descending, then by artist
            allAlbums.sort((a, b) => {
                if (a.rating !== b.rating) return b.rating - a.rating;
                return a.artist.localeCompare(b.artist);
            });

            renderAlbums(); // Initial render
        }

        function renderAlbums(filter = '') {
            const albumList = document.getElementById('albumList');
            albumList.innerHTML = '';

            const lowerFilter = filter.toLowerCase();

            const filteredAlbums = allAlbums.filter(album => {
                return album.artist.toLowerCase().includes(lowerFilter) ||
                       album.albumName.toLowerCase().includes(lowerFilter) ||
                       album.year.includes(lowerFilter);
            });

            let previousRating = null;

            filteredAlbums.forEach(({ artist, albumName, ratingText, rating, year }) => {
                if (previousRating !== null && rating !== previousRating) {
                    const blankLi = document.createElement('li');
                    blankLi.style.height = '1em';
                    albumList.appendChild(blankLi);
                }

                const li = document.createElement('li');
                li.className = 'album-item';
                li.innerHTML = `<span>${artist}</span> - ${albumName} (Rating: ${ratingText}, Year: ${year})`;
                albumList.appendChild(li);

                previousRating = rating;
            });

            if (filteredAlbums.length === 0) {
                const li = document.createElement('li');
                li.textContent = 'No albums found matching your search.';
                li.style.fontStyle = 'italic';
                albumList.appendChild(li);
            }
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                renderAlbums(e.target.value);
            });
        }

        window.onload = () => {
            fetchAlbumData().then(() => {
                setupSearch();
            });
        };
    </script>
</body>
</html>
